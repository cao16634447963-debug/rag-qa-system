services:
  rag:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    # 容器内 localhost 指向自身，必须用服务名 postgres 覆盖连接串
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rag_qa
    volumes:
      - ./server/data:/app/server/data
      - ./docs:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 本地 Postgres（含 pgvector 扩展），承载用户/书签/分类与 RAG 向量库
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_qa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_qa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
